<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoimmune Encephalitis</title>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="interact.js"></script>
  <script src="mitogen-fill.js"></script>
  <script src="ae-mock.js"></script>
  <style>
    :root { --ink:#1f2a37; --muted:#5b6675; --line:#dde3ea; --bg:#f6f8fa; --card:#fff;
            --accent:#1d5fa8; --ok:#1e7a46; --warn:#a15c00; --bad:#b42318; --chip:#eef3f9; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:10px 18px; position:sticky; top:0; z-index:5; }
    header h1 { font-size:17px; margin:0 0 2px; }
    #pt { color:var(--muted); font-size:13px; }
    nav { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
    nav button { border:1px solid var(--line); background:#fff; padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
    nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    main { padding:16px 18px; max-width:1150px; }
    section.tab { display:none; } section.tab.on { display:block; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
    .card h2 { font-size:15px; margin:0 0 8px; } .card h3 { font-size:14px; margin:10px 0 6px; }
    .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:12px; }
    .banner { padding:8px 12px; border-radius:6px; margin-bottom:12px; }
    .banner.info { background:#e8f1fb; } .banner.warn { background:#fff4e0; } .banner.bad { background:#fdecea; }
    .muted { color:var(--muted); } .small { font-size:12px; }
    .chip { display:inline-block; background:var(--chip); border-radius:10px; padding:0 7px; font-size:11px; margin-left:4px; color:var(--accent); }
    .chip.manual { color:var(--muted); }
    .find { padding:4px 0; border-bottom:1px dashed var(--line); }
    .find:last-child { border-bottom:0; }
    .find label { cursor:pointer; }
    details.ev { margin:2px 0 0 24px; font-size:12px; color:var(--muted); }
    details.ev summary { cursor:pointer; }
    .crit { border-left:4px solid var(--line); }
    .crit.met { border-left-color:var(--ok); } .crit.notmet { border-left-color:var(--warn); }
    .status { font-weight:600; } .met .status { color:var(--ok); } .notmet .status { color:var(--warn); }
    ul.tight { margin:4px 0; padding-left:20px; } ul.tight li { margin:2px 0; }
    .y { color:var(--ok); } .n { color:var(--bad); } .q { color:var(--muted); }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
    th { background:#f1f4f7; }
    input[type=text], input[type=email], textarea, select { font:inherit; padding:5px 7px; border:1px solid #c8d0da; border-radius:5px; width:100%; }
    .form { display:grid; grid-template-columns:150px 1fr; gap:6px 10px; align-items:center; }
    .btn { background:var(--accent); color:#fff; border:0; padding:7px 14px; border-radius:6px; cursor:pointer; font:inherit; }
    .btn.sec { background:#fff; color:var(--accent); border:1px solid var(--accent); }
    .btn:disabled { opacity:.5; cursor:default; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    #critbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; font-size:12.5px; }
    #critbar:empty { display:none; }
    .cb-lbl { color:var(--muted); font-weight:600; }
    .cb { border:1px solid var(--line); border-radius:14px; padding:3px 10px; cursor:pointer; font:inherit; background:#fff; }
    .cb.met { background:#eaf6ef; border-color:#9fd3b4; color:var(--ok); }
    .cb.notmet { background:#fff6e5; border-color:#f0cf96; color:var(--warn); }
    .cb span { color:var(--muted); margin-left:2px; }
    details.crit > summary { cursor:pointer; list-style:none; }
    details.crit > summary::-webkit-details-marker { display:none; }
    details.crit > summary h2 { display:inline; }
    details.crit > summary::before { content:'▸'; color:var(--muted); margin-right:6px; display:inline-block; transition:transform .15s; }
    details.crit[open] > summary::before { transform:rotate(90deg); }
    details.crit[open] > summary { margin-bottom:8px; }
    .crit-items li { list-style:none; margin-left:-16px; }
    label.tick { cursor:pointer; }
    .critsum td.y { color:var(--ok); } .critsum td.n { color:var(--warn); }
    .row.nowrap { flex-wrap:nowrap; } .btn.sm { padding:4px 9px; font-size:12px; }
    input.dt { cursor:pointer; }
    .big { font-size:16px; margin:6px 0; }
    .pq { padding:6px 0; border-bottom:1px dashed var(--line); } .pq .row label { font-size:13px; }
    input[type=range] { width:200px; }
    input[type=number] { font:inherit; padding:5px 7px; border:1px solid #c8d0da; border-radius:5px; }
    textarea#note { min-height:360px; font-family:ui-monospace,Consolas,monospace; font-size:12.5px; }
    .alert { border-left:4px solid var(--bad); background:#fdecea; padding:8px 10px; border-radius:4px; margin:6px 0; }
    .tip { border-left:4px solid var(--warn); background:#fff6e5; padding:8px 10px; border-radius:4px; margin:6px 0; }
    .good { border-left:4px solid var(--ok); background:#eaf6ef; padding:8px 10px; border-radius:4px; margin:6px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Autoimmune / Limbic Encephalitis</h1>
    <div id="pt">Loading…</div>
    <div id="critbar"></div>
    <nav id="tabs">
      <button data-tab="overview" class="on">Findings</button>
      <button data-tab="criteria">Criteria</button>
      <button data-tab="phenotype">Antibody &amp; tumour</button>
      <button data-tab="workup">Workup</button>
      <button data-tab="treatment">Treatment</button>
      <button data-tab="doses">Doses</button>
      <button data-tab="trends">Trends</button>
      <button data-tab="requisition">MitogenDx requisition</button>
      <button data-tab="note">Note draft</button>
      <button data-tab="teach">Teach</button>
      <button data-tab="reference">Reference</button>
    </nav>
  </header>
  <main>
    <div id="banner"></div>
    <section class="tab on" id="tab-overview"></section>
    <section class="tab" id="tab-criteria"></section>
    <section class="tab" id="tab-phenotype"></section>
    <section class="tab" id="tab-workup"></section>
    <section class="tab" id="tab-treatment"></section>
    <section class="tab" id="tab-doses"></section>
    <section class="tab" id="tab-trends"></section>
    <section class="tab" id="tab-requisition"></section>
    <section class="tab" id="tab-note"></section>
    <section class="tab" id="tab-teach"></section>
    <section class="tab" id="tab-reference"></section>
    <p class="muted small">Decision support only. Findings marked <span class="chip">chart</span> come from keyword and value matching and can be wrong. Check each one against the chart before relying on it.</p>
  </main>
  <script src="app.js"></script>
<script src="../hospitalist-toolkit/consult-widget.js?v=20261120s"></script>
</body>
</html>
