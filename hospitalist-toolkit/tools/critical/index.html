<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Critical Labs</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
  <script src="config.js"></script>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1b1f24; --muted:#5d6672; --line:#dde1e6;
            --crit:#b42318; --critbg:#fdecea; --ok:#1a7f37; --okbg:#e8f5ec; --btn:#1f4e8c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:12px 16px; }
    header h1 { font-size:18px; margin:0 0 4px; }
    #patient { color:var(--muted); font-size:14px; }
    main { padding:16px; max-width:900px; margin:0 auto; }
    .banner { padding:10px 12px; border-radius:6px; margin-bottom:12px; font-size:14px; }
    .banner.warn { background:#fff6e0; border:1px solid #f0d58a; }
    .banner.crit { background:var(--critbg); border:1px solid #f3b8b2; color:var(--crit); font-weight:600; }
    .banner.ok { background:var(--okbg); border:1px solid #b6dfc1; color:var(--ok); }
    .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--crit);
            border-radius:6px; padding:10px 12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; }
    .card.sent { border-left-color:var(--ok); opacity:.8; }
    .card input { margin-top:4px; width:18px; height:18px; }
    .lab { font-weight:600; }
    .val { font-size:20px; font-weight:700; color:var(--crit); }
    .meta { color:var(--muted); font-size:13px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    button { background:var(--btn); color:#fff; border:0; border-radius:6px; padding:10px 14px; font-size:15px; cursor:pointer; }
    button.secondary { background:#fff; color:var(--btn); border:1px solid var(--btn); }
    button:disabled { opacity:.5; cursor:default; }
    textarea { width:100%; min-height:60px; font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; }
    #status { margin-top:8px; font-size:14px; }
    details { margin-top:16px; font-size:14px; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    td, th { border-bottom:1px solid var(--line); padding:4px 6px; text-align:left; }
  </style>
</head>
<body>
  <header>
    <h1>Critical Labs → MRP</h1>
    <div id="patient">Loading patient…</div>
  </header>
  <main>
    <div id="banners"></div>
    <div id="results"></div>
    <div id="sendBox" hidden>
      <label for="note" class="meta">Optional note to MRP</label>
      <textarea id="note" placeholder="e.g. Repeat K sent, ECG done"></textarea>
      <div class="actions">
        <button id="sendBtn">Send selected to MRP in Teams</button>
        <button id="selectAll" class="secondary">Select all</button>
      </div>
      <div id="status" role="status"></div>
    </div>
    <details>
      <summary id="allSummary">All labs checked</summary>
      <div id="allLabs"></div>
    </details>
  </main>
  <script src="app.js"></script>
</body>
</html>
