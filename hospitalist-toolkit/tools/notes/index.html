<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Compiler</title>
  <style>
    :root { --bg:#f5f7fa; --card:#fff; --ink:#1f2933; --muted:#6b7785; --accent:#0b6bcb; --line:#dde3ea; --err:#b00020; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--accent); color:#fff; padding:12px 20px; }
    header h1 { margin:0; font-size:18px; }
    #patient { font-size:13px; opacity:.9; margin-top:2px; }
    main { max-width:1000px; margin:16px auto; padding:0 16px; display:grid; gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
    .card h2 { margin:0 0 10px; font-size:15px; }
    .types { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:6px 18px; }
    .types label { font-size:14px; cursor:pointer; }
    .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:12px; }
    input[type=number], input[type=date], select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
    input[type=number] { width:72px; }
    button { background:var(--accent); color:#fff; border:0; padding:8px 14px; border-radius:6px; font-size:14px; cursor:pointer; }
    button.secondary { background:#fff; color:var(--accent); border:1px solid var(--accent); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    tr.grprow td { background:#eef4fb; border-top:2px solid var(--line); }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
    #status { font-size:13px; color:var(--muted); }
    #status.error { color:var(--err); }
    .muted { color:var(--muted); font-weight:normal; }
    .small { font-size:12px; }
    .hidden { display:none; }
    /* Compiled output */
    #output { font-size:14px; }
    .docmeta { font-size:13px; margin-bottom:12px; }
    .block { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; background:#fff; }
    .block h3 { margin:0 0 8px; font-size:15px; color:var(--accent); }
    .block.summary { background:#f7fbff; border-color:#b9d3ef; }
    .block p { margin:6px 0; }
    .block ol { margin:4px 0; padding-left:22px; }
    .item { margin:8px 0; }
    .ititle { font-weight:600; font-size:13px; }
    .excerpt { white-space:pre-wrap; font-size:13px; border-left:3px solid var(--accent); padding:2px 0 2px 10px; margin-top:3px; }
    .gsum { margin-bottom:8px; }
    details.full > summary { cursor:pointer; font-weight:600; font-size:13px; color:var(--accent); padding:6px 0; }
    .note { border-top:1px solid var(--line); padding-top:8px; margin-top:8px; }
    .nhead { font-size:13px; font-weight:600; }
    .note pre { white-space:pre-wrap; font-family:Consolas, Menlo, monospace; font-size:12.5px; background:#fbfcfd; border:1px solid var(--line); border-radius:6px; padding:10px; max-height:500px; overflow:auto; }
    @media print {
      header, #searchCard, #listCard, .toolbar, #status { display:none !important; }
      body { background:#fff; } main { max-width:none; margin:0; padding:0; } .card { border:0; padding:0; }
      .note pre { max-height:none; border:0; padding:0; }
      .block { break-inside:auto; } .item, .nhead { break-inside:avoid; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Clinical Note Compiler</h1>
    <div id="patient">Loading patient…</div>
  </header>

  <main>
    <section class="card" id="searchCard">
      <h2>1. Choose what to search</h2>
      <div class="types" id="typeBoxes"></div>
      <div class="row">
        <label>Newest per type:
          <input type="number" id="count" min="1" max="25" value="5">
        </label>
        <label>Since:
          <input type="date" id="since">
        </label>
        <button id="searchBtn" disabled>Search</button>
      </div>
      <p id="status"></p>
    </section>

    <section class="card hidden" id="listCard">
      <h2>2. Pick documents to include</h2>
      <div class="toolbar">
        <button class="secondary" id="selAll">Select all</button>
        <button class="secondary" id="selNone">Select none</button>
        <label>Order within each heading:
          <select id="order">
            <option value="desc">Newest first</option>
            <option value="asc">Oldest first</option>
          </select>
        </label>
        <button id="compileBtn">Compile selected</button>
      </div>
      <table>
        <thead><tr><th></th><th>Date</th><th>Type</th><th>Author</th><th>Format</th></tr></thead>
        <tbody id="docRows"></tbody>
      </table>
    </section>

    <section class="card hidden" id="outCard">
      <h2>3. Compiled document</h2>
      <div class="toolbar">
        <button class="secondary" id="copyBtn">Copy</button>
        <button class="secondary" id="dlBtn">Download .txt</button>
        <button class="secondary" id="docBtn">Download Word</button>
        <button class="secondary" id="printBtn">Print / PDF</button>
        <button class="secondary" id="openAll">Show all notes</button>
        <button class="secondary" id="closeAll">Hide full notes</button>
      </div>
      <div id="output"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script><script src="../../pdf-overlay.js?v=20261030b"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
