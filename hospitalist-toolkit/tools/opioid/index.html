<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opioid safety</title>
<link rel="stylesheet" href="opioid.css?v=20261027b">
<script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
<script src="opioid.js?v=20261027b"></script>
<script src="opioid-mock.js?v=20261027b"></script>
</head>
<body>
<header>
  <h1>Opioid safety</h1>
  <div id="patient">Loading patient…</div>
</header>
<main>
  <div class="toolbar">
    <span>Over-sedation and respiratory depression screen · last 72 h</span>
    <span class="tb-right">
      <select id="case" hidden aria-label="Test patient"></select>
      <button type="button" id="refresh">Refresh</button>
    </span>
  </div>
  <div id="banner"></div>
  <div id="op-tab"></div>
</main>
<script>
  // Open index.html?demo=1 to see the tab with a made-up patient, no launch needed.
  const DEMO = new URLSearchParams(location.search).has('demo');
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const showError = (msg) => { $('banner').innerHTML = '<div class="banner banner-error">' + esc(msg) + '</div>'; };

  function patientLine(p) {
    const n = (p.name || []).find((x) => x.use === 'official') || (p.name || [])[0] || {};
    const name = n.text || [(n.given || []).join(' '), n.family].filter(Boolean).join(' ') || 'Unknown name';
    let age = '';
    if (p.birthDate) { const b = new Date(p.birthDate), d = new Date(); let a = d.getFullYear() - b.getFullYear();
      if (d < new Date(d.getFullYear(), b.getMonth(), b.getDate())) a--; age = a + ' y'; }
    return [name, age, p.gender, p.birthDate ? 'DOB ' + p.birthDate : ''].filter(Boolean).map(esc).join(' · ');
  }

  async function startDemo() {
    $('banner').innerHTML = '<div class="banner banner-demo">Demo mode: made-up test patients, no FHIR server. Pick a patient, or the unit view to see them ranked the way a ward worklist would be.</div>';
    const sel = $('case');
    sel.hidden = false;
    sel.innerHTML = '<option value="unit">Unit view — all test patients</option>' +
      OPMock.CASES.map((c) => `<option value="${c.key}">${esc(c.label)}</option>`).join('');
    const want = new URLSearchParams(location.search).get('case');
    if (want && [...sel.options].some((o) => o.value === want)) sel.value = want;

    const run = () => {
      const now = Date.now(), key = sel.value;
      const u = new URL(location.href); u.searchParams.set('case', key); history.replaceState(null, '', u);
      if (key === 'unit') { $('patient').textContent = 'Demo unit · ' + OPMock.CASES.length + ' test patients'; return unitView(now); }
      const data = OPMock.make(now, key);
      $('patient').innerHTML = patientLine(data.patient);
      return OP.mount($('op-tab'), null, { now, loader: () => Promise.resolve(data) });
    };
    sel.onchange = run;
    $('refresh').onclick = run;
    await run();
  }

  // Ranks every test patient - a preview of what a unit-wide sweep would show.
  function unitView(now) {
    const order = { red: 0, amber: 1, green: 2, none: 3 };
    const rows = OPMock.CASES.map((c) => ({ c, d: OPMock.make(now, c.key) })).map((x) => Object.assign(x, { r: OP.assess(x.d) }))
      .sort((a, b) => order[a.r.tier] - order[b.r.tier] || b.r.points - a.r.points);
    const top = (r) => r.flags.slice().sort((a, b) => (b.red - a.red) || (b.pts - a.pts)).slice(0, 3)
      .map((f) => `<span class="${f.red ? 'why red' : 'why'}">${esc(f.text)}</span>`).join('');
    $('op-tab').innerHTML = `<table class="unit"><thead><tr><th>Risk</th><th>Patient</th><th>Points</th><th>MME 24 h</th><th>Main reasons</th></tr></thead><tbody>${
      rows.map(({ c, d, r }) => `<tr data-k="${c.key}" tabindex="0">
        <td><span class="pill pill-${r.tier}">${r.tier.toUpperCase()}</span></td>
        <td><b>${esc(d.patient.name[0].given[0] + ' ' + d.patient.name[0].family)}</b><br><small>${r.age} ${esc(d.patient.gender)} · ${esc(c.label.split(' — ')[0].split(' · ').slice(2).join(' · '))}</small></td>
        <td>${r.points}</td>
        <td>${r.mme.last24 != null ? r.mme.last24 : '≤' + r.mme.ordered + ' <small>(orders)</small>'}</td>
        <td>${top(r)}</td></tr>`).join('')}</tbody></table>
      <p class="unit-note">Click a patient to open their full screen. In real use this list would come from a scheduled sweep of the unit, not from opening each chart.</p>`;
    document.querySelectorAll('table.unit tr[data-k]').forEach((tr) => {
      const go = () => { $('case').value = tr.dataset.k; $('case').onchange(); };
      tr.onclick = go; tr.onkeydown = (e) => { if (e.key === 'Enter') go(); };
    });
  }

  async function startSmart() {
    let client;
    try { client = await FHIR.oauth2.ready(); }
    catch (e) {
      $('patient').textContent = '';
      showError('Not launched. Open this from the Hospitalist Toolkit or the Cerner sandbox. To preview with a made-up patient, add ?demo=1 to this page’s address.\n\n' + (e && e.message ? e.message : e));
      return;
    }
    client.patient.read().then((p) => { $('patient').innerHTML = patientLine(p); }).catch(() => { $('patient').textContent = 'Patient ' + client.patient.id; });
    const run = () => OP.mount($('op-tab'), client, {}).catch((e) => showError('The screen stopped with an error: ' + (e && e.message ? e.message : e)));
    $('refresh').onclick = run;
    run();
  }

  const missing = [];
  if (typeof OP === 'undefined') missing.push('opioid.js');
  if (typeof FHIR === 'undefined' && !DEMO) missing.push('the SMART library (fhir-client.js from cdn.jsdelivr.net)');
  if (DEMO && typeof OPMock === 'undefined') missing.push('opioid-mock.js');
  if (missing.length) showError('Couldn’t load: ' + missing.join(', ') + '.\nMake sure these files are in the same folder as index.html, then press Ctrl + F5.');
  else (DEMO ? startDemo() : startSmart()).catch((e) => showError('The screen stopped with an error: ' + (e && e.message ? e.message : e)));
</script>
</body>
</html>
