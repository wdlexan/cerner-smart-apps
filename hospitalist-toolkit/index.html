<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- iPhone home-screen app (pocket mode, no Cerner): see pocket.js -->
  <link rel="manifest" href="pocket.webmanifest">
  <link rel="apple-touch-icon" href="pocket-icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Toolkit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b6bcb">
  <title>Hospitalist Toolkit</title>
  <style>
    :root { --bg:#f5f7fa; --ink:#1f2933; --muted:#6b7785; --accent:#0b6bcb; --line:#dde3ea; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink);
           display:flex; flex-direction:column; }
    header { background:var(--accent); color:#fff; padding:10px 20px 0; }
    .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; }
    header h1 { margin:0; font-size:17px; }
    #patient { font-size:13px; opacity:.95; }
    .navrow { display:flex; align-items:center; gap:10px; margin-top:8px; }
    #toolsearch { flex:0 0 210px; padding:6px 10px; border:0; border-radius:6px; font-size:13px; margin-bottom:4px; }
    #toolsearch:focus { outline:2px solid #fff; }
    #nomatch { font-size:13px; color:#dbe9f8; padding:8px 0; }
    nav { display:flex; gap:2px; overflow-x:auto; min-width:0; }
    nav button { background:transparent; color:#dbe9f8; border:0; border-bottom:3px solid transparent; padding:8px 14px;
                 font-size:14px; cursor:pointer; white-space:nowrap; }
    nav button:hover { color:#fff; }
    nav button.on { color:#fff; border-bottom-color:#fff; font-weight:600; }
    #frames { flex:1; position:relative; min-height:0; }
    #frames iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; }
    #frames iframe.on { display:block; }
    .msg { max-width:900px; margin:24px auto; padding:16px; background:#fff; border:1px solid var(--line); border-radius:8px; font-size:14px; }
    .err { color:#b00020; }
    /* pocket mode (iPhone): clear the notch and home bar, tighter header, full-width search */
    html.pocket header { padding:calc(env(safe-area-inset-top) + 6px) 12px 0; }
    html.pocket .navrow { flex-wrap:wrap; gap:4px; }
    html.pocket #toolsearch { flex:1 1 100%; font-size:16px; } /* 16px stops iOS zooming in on tap */
    html.pocket nav button { padding:8px 10px; }
    html.pocket #pdfbar { display:none !important; } /* no Import PDF on the phone */
    html.pocket #frames { margin-bottom:env(safe-area-inset-bottom); }
    html.pocket #frames iframe { -webkit-overflow-scrolling:touch; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1>Hospitalist Toolkit</h1>
      <div id="patient">Loading patient…</div>
    </div>
    <div class="navrow">
      <input id="toolsearch" type="search" placeholder="Find a tool…  ( / )" aria-label="Find a tool" autocomplete="off" hidden>
      <nav id="tabs"></nav>
      <span id="nomatch" hidden>No tool matches</span>
    </div>
  </header>
  <div id="frames"><div class="msg" id="msg">Signing in…</div></div>

  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
  <script src="pocket.js?v=20261120a"></script>
  <script src="pdf-overlay.js?v=20261120p"></script>
  <script src="shell.js?v=20261120r"></script>
  <script src="consult-widget.js?v=20261120g"></script>
  <script src="pdf-extract.js?v=20261121a"></script>
  <script src="sample-pdfs/index.js?v=20261120a"></script>
  <script src="pdf-import.js?v=20261121a"></script>
</body>
</html>
