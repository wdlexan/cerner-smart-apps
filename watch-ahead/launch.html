<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Launching…</title>
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.js"></script>
</head>
<body>
  <p id="msg">Launching app, please wait…</p>
  <script>
    // Register this app on its own in the Cerner Code Console and paste its client ID here.
    // Enable these READ scopes there: Patient, Condition, MedicationRequest, AllergyIntolerance, Observation.
    // Redirect URI = the full address of this folder's index.html. Launch URI = the full address of this file.
    const CLIENT_ID = "PASTE-THIS-APPS-CLIENT-ID-HERE";
    function fail(text) { document.getElementById("msg").innerHTML = "<pre style='color:#b00020;white-space:pre-wrap'>" + text + "</pre>"; }
    if (typeof FHIR === "undefined") {
      fail("The FHIR client library failed to load (check internet/ad-blocker and the console).");
    } else {
      FHIR.oauth2.authorize({
        clientId: CLIENT_ID,
        scope: "launch openid fhirUser online_access patient/Patient.read patient/Condition.read patient/MedicationRequest.read patient/AllergyIntolerance.read patient/Observation.read",
        redirectUri: "index.html"
      }).catch((err) => fail("Launch failed: " + (err && err.message ? err.message : err)));
    }
  </script>
</body>
</html>
